<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Battery Test CSV • RTR Battery Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

    <h1 class="page-title">Upload Battery Test CSV</h1>

    <div class="form-card">

        <!-- Success/Error messages -->
        <div th:if="${success != null}" class="success-message" th:text="${success}">
            Upload successful!
        </div>
        <div th:if="${error != null}" class="error-message" th:text="${error}">
            Upload failed!
        </div>

        <form th:action="@{/battery-tests/upload}" method="post" enctype="multipart/form-data" id="uploadForm">

            <div class="upload-area" id="dropArea">
                <label for="file" class="file-label">Choose CSV File or Drag & Drop</label>
                <input type="file" name="file" id="file" accept=".csv" required />
                <div class="file-name" id="fileName">No file selected</div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-upload" id="uploadBtn" disabled>Upload CSV</button>
                <a th:href="@{/battery-tests/all}" class="btn btn-back">Cancel</a>
            </div>
        </form>

        <div style="margin-top: 30px; font-size: 14px; color: #888; text-align: center;">
            Supported format: CSV with columns matching battery test fields<br>
            (Serial Number, Test Date, Voltage, Resistance, etc.)
        </div>
    </div>
</div>

<script>
    const dropArea = document.getElementById('dropArea');
    const fileInput = document.getElementById('file');
    const fileName = document.getElementById('fileName');
    const uploadBtn = document.getElementById('uploadBtn');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        dropArea.addEventListener(eventName, () => dropArea.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, () => dropArea.classList.remove('dragover'), false);
    });

    dropArea.addEventListener('drop', handleDrop, false);
    fileInput.addEventListener('change', handleFileSelect, false);

    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        handleFiles(files);
    }

    function handleFileSelect(e) {
        handleFiles(e.target.files);
    }

    function handleFiles(files) {
        if (files.length > 0) {
            const file = files[0];
            if (file.name.toLowerCase().endsWith('.csv')) {
                fileName.textContent = file.name;
                uploadBtn.disabled = false;
            } else {
                fileName.textContent = "Please select a CSV file";
                uploadBtn.disabled = true;
            }
        }
    }
</script>

</body>
</html>
